# Local development database. The data directory is created relative to the application working directory.
database.url=jdbc:h2:file:./data/fakrudeenmart;DB_CLOSE_DELAY=-1
database.driver=org.h2.Driver
database.pool.maximum-size=5
database.pool.minimum-idle=1
database.pool.connection-timeout-ms=10000

# Optional local credentials; blank values keep the embedded database credential-free.
database.username=
database.password=
